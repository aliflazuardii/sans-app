<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sans Photo — Studio Fotografi</title>
  <meta name="description" content="Sans Photo: portofolio, paket foto, booking online, dan hasil foto untuk client.">
  <meta name="theme-color" content="#111827">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Terapkan tema tersimpan sebelum render (hindari kedip)
    try { var t = localStorage.getItem('sp_theme'); if (t) document.documentElement.setAttribute('data-theme', t);
      else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#app">Lewati ke konten</a>

  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/etalase" id="brand"></a>
      <nav class="nav" id="nav" aria-label="Navigasi utama"></nav>
      <div class="top-actions">
        <button class="btn btn-ghost btn-icon" id="btn-theme" aria-label="Ganti tema terang/gelap" title="Ganti tema"></button>
        <div id="user-slot" class="row"></div>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>
  <footer class="footer" id="footer"></footer>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" role="status"></div>

  <!-- Pustaka (CDN, versi dikunci) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales-all.global.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>

  <!-- Aplikasi -->
  <script src="js/config.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/public.js" defer></script>
  <script src="js/admin.js" defer></script>
  <script src="js/calendar.js" defer></script>
  <script src="js/finance.js" defer></script>
  <script src="js/manage.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
